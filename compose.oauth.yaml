services:
  obsidian-kanban-mcp:
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      OAUTH_HOST: 0.0.0.0
      OAUTH_PORT: 8771
      OAUTH_OWNER_TOKEN_FILE: /run/secrets/oauth-owner-token
      OAUTH_STATE_DIR: /oauth-state
      OAUTH_ALLOWED_REDIRECT_HOSTS: ${OAUTH_ALLOWED_REDIRECT_HOSTS:-chatgpt.com}
    volumes:
      - ${OAUTH_STATE_PATH:?set OAUTH_STATE_PATH in .env}:/oauth-state
      - ${OAUTH_OWNER_TOKEN_PATH:?set OAUTH_OWNER_TOKEN_PATH in .env}:/run/secrets/oauth-owner-token:ro
    ports:
      - "127.0.0.1:${OAUTH_BIND_PORT:-8771}:8771"
